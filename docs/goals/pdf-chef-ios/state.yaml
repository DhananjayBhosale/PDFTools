version: 2

goal:
  title: "PDF Chef iOS Production-Ready Application"
  slug: "pdf-chef-ios"
  kind: existing_plan
  tranche: "Complete successive safe verified design and engineering slices until the full iOS outcome is proven."
  status: done
  intake:
    original_request: "Create and open a local live GoalBuddy board, then autonomously complete PDF Chef iOS through final audits."
    interpreted_outcome: "A polished, private, offline React/Capacitor PDF Chef iOS app with Claude-owned UI and Codex-owned engineering is installed, launched, tested, and independently accepted."
    input_shape: existing_plan
    audience: "iPhone and iPad users handling sensitive PDF documents"
    authority: approved
    proof_type: demo
    completion_proof: "Claude Opus 5 High UI acceptance plus Codex engineering acceptance backed by simulator, persistence, offline, functional, automated, responsive, accessibility, and unchanged-Android evidence."
    likely_misfire: "Stopping after planning or build success, letting Codex make UI decisions, using remote or temporary assets, or claiming verification that was not performed."
    blind_spots_considered:
      - "Exact Claude Code Opus 5 High availability and authenticated model evidence."
      - "Non-Git checkout requires file manifests and hashes instead of commit evidence."
      - "Simulator, share-sheet, offline OCR/PDF assets, iPad, and accessibility test availability."
      - "Pre-existing PDF algorithm defects may require explicit DEFERRED classification."
    existing_plan_facts:
      - "Strict Claude UI owner and Codex engineering owner."
      - "React/Vite shared source with Capacitor iOS; no SwiftUI rewrite."
      - "Home, Recent, and Settings with persistent local files and metadata."
      - "Typed web and iOS platform interfaces suitable for future Capacitor Android."
      - "Exact automated, web, iOS sync, simulator, offline, PDF flow, screenshot, accessibility, and final-audit gates."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  parallel_write_exception: null
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  strict_two_owner_model: true

agents:
